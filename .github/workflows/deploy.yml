name: Deploy

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy static page
    runs-on: ubuntu-latest

    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate deployment secrets
        run: |
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_SSH_KEY"

      - name: Normalize deployment secrets
        run: |
          {
            printf 'DEPLOY_HOST=%s\n' "$(printf '%s' "$DEPLOY_HOST" | tr -d '\r\n')"
            printf 'DEPLOY_USER=%s\n' "$(printf '%s' "$DEPLOY_USER" | tr -d '\r\n')"
          } >> "$GITHUB_ENV"

      - name: Verify deployment files
        run: |
          test -s index.html
          bash -n infra/deploy/deploy.sh
          grep -Fq 'try_files $uri $uri/ =404;' infra/nginx/ohar.name.conf
          ! grep -Fq 'ohar-studio.ru' infra/nginx/ohar.name.conf

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s %s\n' "$DEPLOY_HOST" 'ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIFivnoLQZrVLP/LacoNl6TS3ggU7REoUZCE3qFy4byQH' >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload page archive
        run: |
          tar -czf site.tar.gz index.html
          ssh "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p /tmp/ohar.name-deploy"
          scp site.tar.gz "$DEPLOY_USER@$DEPLOY_HOST:/tmp/ohar.name-deploy/site.tar.gz"
          scp infra/nginx/ohar.name.conf "$DEPLOY_USER@$DEPLOY_HOST:/tmp/ohar.name-deploy/ohar.name.conf"

      - name: Activate release
        run: |
          ssh "$DEPLOY_USER@$DEPLOY_HOST" "sudo /usr/local/sbin/deploy-ohar-name '$GITHUB_SHA'"

      - name: Verify deployed page
        run: |
          curl --fail --silent --show-error --retry 3 https://ohar.name/ -o deployed-index.html
          cmp index.html deployed-index.html
          for path in /about/ /portfolio/ /cv/ /dw/ /quotes/ /xss.js; do
            status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "https://ohar.name$path")
            test "$status" = 404
          done
