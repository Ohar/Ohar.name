name: Deploy

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest

    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate deployment secrets
        run: |
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_SSH_KEY"

      - name: Normalize deployment secrets
        run: |
          {
            printf 'DEPLOY_HOST=%s\n' "$(printf '%s' "$DEPLOY_HOST" | tr -d '\r\n')"
            printf 'DEPLOY_USER=%s\n' "$(printf '%s' "$DEPLOY_USER" | tr -d '\r\n')"
          } >> "$GITHUB_ENV"

      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: yarn

      - name: Install Yarn
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate
          yarn --version

      - name: Install dependencies
        run: yarn install --frozen-lockfile --non-interactive

      - name: Build site
        run: yarn build

      - name: Verify generated pages
        run: yarn test:i18n

      - name: Verify CV PDF page count
        run: yarn test:cv-pdf

      - name: Verify nginx redirects
        run: |
          grep -Fq 'location = /portfolio {' infra/nginx/ohar.name.conf
          grep -Fq 'location = /portfolio/ {' infra/nginx/ohar.name.conf
          ! grep -Fq '$server_protocol' infra/nginx/ohar.name.conf

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s %s\n' "$DEPLOY_HOST" 'ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIFivnoLQZrVLP/LacoNl6TS3ggU7REoUZCE3qFy4byQH' >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload build archive
        run: |
          tar -C out -czf site.tar.gz .
          ssh "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p /tmp/ohar.name-deploy"
          scp site.tar.gz "$DEPLOY_USER@$DEPLOY_HOST:/tmp/ohar.name-deploy/site.tar.gz"
          scp infra/nginx/ohar.name.conf "$DEPLOY_USER@$DEPLOY_HOST:/tmp/ohar.name-deploy/ohar.name.conf"

      - name: Activate release
        run: |
          ssh "$DEPLOY_USER@$DEPLOY_HOST" "sudo /usr/local/sbin/deploy-ohar-name '$GITHUB_SHA'"
