server {
    listen 80;
    listen [::]:80;
    server_name ohar.name www.ohar.name;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    return 301 https://ohar.name$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.ohar.name;

    ssl_certificate /etc/letsencrypt/live/ohar.name/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ohar.name/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    if ($server_protocol != "HTTP/2.0") {
        return 426;
    }

    return 301 https://ohar.name$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ohar.name;

    root /var/www/ohar.name/current;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/ohar.name/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ohar.name/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    if ($server_protocol != "HTTP/2.0") {
        return 426;
    }

    location = /portfolio {
        return 301 https://ohar-studio.ru/;
    }

    location = /portfolio/ {
        return 301 https://ohar-studio.ru/;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;

    location = /404.html {
        internal;
    }

    location ~* \.(?:css|js|jpg|jpeg|gif|png|webp|svg|ico|pdf|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}